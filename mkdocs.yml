site_name: Mayuresh's ROMs
site_url: https://mayuresh2543.github.io/RomWiki/
repo_url: https://github.com/mayuresh2543
repo_name: mayuresh2543

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font: false
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - navigation.top
    - navigation.path
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Getting started: index.md
  - Devices:
    - Overview: devices.md
    - Redmi Note 12 5G / POCO X5 5G (stone):
      - Device Info: stone.md
      - Downloads: stone_downloads.md
      - Installation: stone/install.md
    - Redmi Note 11 (spes):
      - Device Info: spes.md
      - Downloads: spes_downloads.md
      - Installation: spes/install.md
  - Google Apps: gapps.md
  - Troubleshooting: troubleshooting.md

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/marked/marked.min.js
  - javascripts/custom.js
